<div
  class="max-w-sm bg-white border border-gray-200 rounded-lg shadow-sm h-full"
>
  <a (click)="openDoctorDetails()">
    <img
      class="rounded-t-lg"
      [src]="doctor().imageUrl ? doctor().imageUrl : doctorMale"
      alt="Doctor Image"
    />
  </a>
  <div class="p-5">
    <a (click)="openDoctorDetails()">
      <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900">
        {{ doctor()?.drName }}
      </h5>
    </a>
    <h5 class="mb-2 text-lg font-bold tracking-tight text-gray-900">
      {{ doctor()?.degree }}
    </h5>
    <p class="mb-3 font-normal text-gray-700">
      {{ doctor()?.description?.slice(0, 100) }}
    </p>

    @if (department()) {
    <div class="flex gap-2">
      <button
        (click)="openDoctorDetails()"
        class="inline-block rounded border-2 border-primary px-6 pb-[6px] pt-2 text-xs font-medium uppercase leading-normal text-blue-600 transition duration-150 ease-in-out hover:border-primary-accent-300 hover:bg-blue-600-50/50 hover:text-blue-600-accent-300 focus:border-primary-600 focus:bg-blue-600-50/50 focus:text-blue-600-600 focus:outline-none focus:ring-0 active:border-primary-700 active:text-blue-600-700 motion-reduce:transition-none"
      >
        Doctor Details
      </button>
      <button
        (click)="openAppointment()"
        class="inline-block rounded bg-blue-600 px-6 pb-2 pt-2.5 text-xs font-medium uppercase leading-normal text-gray-50 shadow-primary-3 transition duration-150 ease-in-out hover:bg-blue-600-accent-300 hover:shadow-primary-2 focus:bg-blue-600-accent-300 focus:shadow-primary-2 focus:outline-none focus:ring-0 active:bg-blue-600-600 active:shadow-primary-2 motion-reduce:transition-none"
      >
        Appointment
      </button>
    </div>
    } @else {
    <div class="card-actions justify-end">
      <button
        class="rounded bg-sky-600 px-4 py-2 text-gray-50 transition-all hover:opacity-80"
      >
        Update
      </button>
      <button
        class="rounded bg-red-600 px-4 py-2 text-gray-50 transition-all hover:opacity-80"
      >
        Delete
      </button>
    </div>
    }
  </div>
</div>

@if(showModal()){
<app-doctor-details
  [doctor]="doctor()"
  (closeDoctorDetails)="closeDoctorDetails()"
  (handleClick)="handleClick()"
></app-doctor-details>
} @if(showAppointment()) {
<app-appointment-modal
  id=""
  [doctor]="doctor()"
  (closeAppointment)="closeAppointment()"
></app-appointment-modal>
}
