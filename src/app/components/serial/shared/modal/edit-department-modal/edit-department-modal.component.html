<div
  class="fixed top-0 left-0 w-screen h-screen z-50 bg-black/60 backdrop-blur-sm flex justify-center items-center"
>
  <div class="rounded-xl max-w-[840px] w-full max-h-[90vh] overflow-y-auto">
    <form
      (submit)="onSubmit($event)"
      novalidate
      class="bg-[#e3c9f8] p-6 space-y-6 rounded-lg shadow-lg"
    >
      <div class="flex justify-between">
        <h2 class="text-2xl font-bold text-center w-full">Edit Department</h2>
        <button
          type="button"
          class="rounded bg-red-600 p-2 w-8 h-8 text-center text-gray-50 transition-all hover:opacity-80"
          (click)="closeThisModal()"
        >
          X
        </button>
      </div>

      @let nameField = editDepartmentForm.departmentName();

      <div class="grid grid-cols-1 w-full gap-x-5">
        <!-- departmentName Input -->
        <label class="form-control w-full !mt-0">
          <div class="label !py-0">
            <span class="label-text font-bold capitalize">Department Name</span>
          </div>
          <input
            type="text"
            [formField]="editDepartmentForm.departmentName"
            [class.border-rose-500]="
              !nameField.valid() && (nameField.touched() || isSubmitted())
            "
            placeholder="Type here"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 input-sm outline-none"
          />
          @if ((nameField.touched() || isSubmitted()) && !nameField.valid()) {
            @for (err of nameField.errors(); track err.kind) {
              <div class="label !py-0">
                <span class="label-text-alt text-rose-600 capitalize">{{
                  err.message || err.kind
                }}</span>
              </div>
            }
          }
        </label>

        <!-- Image Input -->
        <label class="form-control w-full !mt-0">
          <div class="label !py-0">
            <span class="label-text font-bold capitalize">Image URL</span>
          </div>
          <input
            type="text"
            [formField]="editDepartmentForm.imgUrl"
            placeholder="Paste image URL here"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 input-sm outline-none"
          />
        </label>

        <!-- description Input -->
        <label class="form-control w-full !mt-0">
          <div class="label !py-0">
            <span class="label-text font-bold capitalize">Description</span>
          </div>
          <textarea
            [formField]="editDepartmentForm.description"
            placeholder="Type description here"
            class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500"
            cols="30"
            rows="10"
          ></textarea>
        </label>
      </div>

      <div class="!mt-2">
        <button
          type="submit"
          [disabled]="
            isSubmitting() || (isSubmitted() && !editDepartmentForm().valid())
          "
          class="rounded bg-blue-600 py-1 text-gray-50 transition-all hover:opacity-80 w-full mt-2 disabled:opacity-60 inline-flex justify-center items-center gap-2"
        >
          @if (isSubmitting()) {
            <span
              class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
            ></span>
            <span>Updating...</span>
          } @else {
            <span>Update Department</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
