<div
  class="fixed top-0 left-0 w-screen h-screen z-50 bg-black/60 backdrop-blur-sm flex justify-center items-center"
>
  <div class="rounded-xl max-w-[840px] w-full max-h-[90vh] overflow-y-auto">
    <form
      (submit)="onSubmit($event)"
      novalidate
      class="bg-[#e3c9f8] p-6 space-y-6 rounded-lg shadow-lg"
    >
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-center w-full">Edit User Roles</h2>
        <button
          type="button"
          class="rounded bg-red-600 p-2 w-8 h-8 text-center text-gray-50 transition-all hover:opacity-80"
          (click)="closeThisModal()"
        >
          X
        </button>
      </div>

      @if (errorMessage) {
        <div class="alert alert-error">
          <span>{{ errorMessage }}</span>
        </div>
      }

      @let roleField = userForm.role();

      <div class="grid grid-cols-1 w-full gap-x-5">
        <!-- Username Display -->
        <label class="form-control w-full">
          <div class="label">
            <span class="label-text font-bold">Username</span>
          </div>
          <input
            type="text"
            [value]="model().username"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            readonly
            disabled
          />
        </label>

        <!-- Role Selection -->
        <label class="form-control w-full">
          <div class="label">
            <span class="label-text font-bold">Roles</span>
            @if ((roleField.touched() || isSubmitted()) && !roleField.valid()) {
              <span class="label-text-alt text-rose-600"
                >At least one role is required</span
              >
            }
          </div>
          <select
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 select-sm w-full !h-60"
            multiple
            (change)="onRoleChange($event)"
            [class.border-rose-500]="
              (roleField.touched() || isSubmitted()) && !roleField.valid()
            "
          >
            <option
              disabled
              class="text-center border-b font-bold text-gray-900"
            >
              Select Multiple Roles
            </option>
            @for (role of userRole(); track role.id) {
              <option
                [value]="role.id"
                [selected]="isRoleSelected(role.id)"
                class="p-2 text-center border-b"
              >
                {{ role.name }}
              </option>
            } @empty {
              <option disabled>No roles available</option>
            }
          </select>
        </label>
      </div>

      <div class="!mt-2">
        <button
          type="submit"
          [disabled]="
            isSubmitting() ||
            (isSubmitted() && !userForm().valid()) ||
            isLoading()
          "
          class="rounded bg-blue-600 py-1 text-gray-50 transition-all hover:opacity-80 w-full mt-2 disabled:opacity-60 inline-flex justify-center items-center gap-2"
        >
          @if (isSubmitting()) {
            <span
              class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
            ></span>
            <span>Saving...</span>
          } @else {
            <span>Save Changes</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>

<!-- expose model getter to template -->
<ng-container>{{ "" }}</ng-container>
