<app-home-cover title="hospital gallery list" path="Gallery"></app-home-cover>

<div class="container mx-auto my-24">
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
    @for (data of gallery(); track data.id) {
    <app-gallery-card
      [img]="data.gPicUrl"
      [title]="data.galeryName"
      [description]="data.description"
    />
    } @empty {
    <p>No Gallery Found!</p>
    }
  </div>
</div>
