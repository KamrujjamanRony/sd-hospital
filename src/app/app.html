@if (store.loading()) {
<div
  class="fixed inset-0 bg-white bg-opacity-80 flex items-center justify-center z-50"
>
  <div class="text-center">
    <div
      class="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-600 mx-auto"
    ></div>
    <p class="mt-4 text-lg font-semibold">Loading Application Data...</p>
  </div>
</div>
} @if (store.error()) {
<div
  class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded m-4 ml-16 -mb-12 text-center top-40 fixed z-50"
>
  <p>{{ store.error() }}</p>
  <button
    (click)="retryLoading()"
    class="ml-4 bg-green-600 text-white px-2 py-0.5 rounded text-sm"
  >
    Retry
  </button>
  <button
    (click)="closeError()"
    class="ml-4 bg-red-600 text-white px-2 py-0.5 rounded text-sm"
  >
    Close
  </button>
</div>
}@if(store.success()){
<confirm-modal [title]="store.success()" />
}

<main class="text-black placeholder:text-gray-900 bengali-400">
  <router-outlet />
</main>
